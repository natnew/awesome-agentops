name: Apply evolving intent README update

on:
  push:
    branches:
      - add-evolving-intent-evaluation
    paths:
      - .github/workflows/apply-evolving-intent-readme.yml

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: add-evolving-intent-evaluation
          fetch-depth: 0

      - name: Update README
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          content = path.read_text(encoding="utf-8")
          marker = "- [AgentCompass](https://arxiv.org/abs/2607.13705) - Evaluation infrastructure for agent benchmarks, harnesses, environments, asynchronous execution, and trajectory-level failure analysis."
          entry = "- [LLMs Get Lost in Evolving User Intent](https://github.com/microsoft/evolving-intent) - Benchmark framework for testing whether agents track incrementally revealed, revised, and redirected user intent across multi-turn tasks."

          if entry not in content:
              if marker not in content:
                  raise RuntimeError("Could not find the final Evaluation and Testing entry")
              content = content.replace(marker, marker + "\n" + entry, 1)
              path.write_text(content, encoding="utf-8")

          Path(".github/workflows/apply-evolving-intent-readme.yml").unlink()

      - name: Commit README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "docs: add evolving intent evaluation resource"
          git push origin HEAD:add-evolving-intent-evaluation
